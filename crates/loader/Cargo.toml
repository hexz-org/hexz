[package]
name = "hexz-loader"
version = "0.1.0-alpha"
edition = "2024"
authors = ["Will McCallion"]
license = "Apache-2.0"
repository = "https://github.com/willmccallion/hexz"
description = "Python bindings for Hexz - high-performance ML data loading"

[lib]
name = "hexz_loader"
crate-type = ["cdylib"]

[dependencies]
hexz-core = { workspace = true }
hexz-common = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["full"] }
bincode.workspace = true
tempfile = "3.10"
serde_json = "1.0"

[features]
default = ["s3", "compression-zstd", "signing"]

# Cloud storage backends
s3 = ["hexz-core/s3"]

# Compression algorithms
compression-zstd = ["hexz-core/compression-zstd"]

# Security features
encryption = ["hexz-core/encryption"]
signing = ["hexz-core/signing", "hexz-common/signing"]

# All features (for users who want everything)
full = ["s3", "compression-zstd", "encryption", "signing"]
