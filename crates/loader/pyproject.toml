[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hexz"
version = "0.4.2"
description = "High-performance snapshot storage library with compression and encryption"
authors = [{name = "Will"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
# ML frameworks (optional - install only what you need)
numpy = ["numpy>=1.20"]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.13"]

# HDF5 conversion support
hdf5 = ["h5py>=3.0"]

# Common ML combinations
ml = ["numpy>=1.20", "torch>=2.0"]

# Conversion with all optional format support
convert = ["h5py>=3.0"]

# All features
full = ["numpy>=1.20", "torch>=2.0", "tensorflow>=2.13", "h5py>=3.0"]

# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "pytest-timeout>=2.0",
    "pytest-mock>=3.0",
    "moto[server]>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# Legacy alias for test dependencies
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "pytest-timeout>=2.0",
    "pytest-mock>=3.0",
    "moto[server]>=5.0"
]

[tool.maturin]
python-source = "python"
module-name = "hexz.hexz_loader"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "asyncio: mark a test as an asyncio test",
]
