[package]
name = "hexz-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Core engine for high-performance data streaming and compression"

[dependencies]
hexz-common.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
bincode.workspace = true
bytes.workspace = true
tokio.workspace = true
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Compression
lz4_flex = "0.11"
zstd = { version = "0.13", optional = true }

# Crypto
aes-gcm = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
zeroize = { version = "1", optional = true }
sha2.workspace = true
blake3 = "1.5"

# Utils
crc32fast = "1.3"
lru = "0.12"
rayon = "1.8"
dashmap = "5.5"
memmap2 = "0.9"
rust-s3 = { version = "0.33", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"], optional = true }
url = "2.5"
fastcdc = "3.1"

[features]
default = ["compression-zstd", "encryption", "s3", "signing"]

s3 = ["dep:rust-s3"]
compression-zstd = ["dep:zstd"]
encryption = ["dep:aes-gcm", "dep:pbkdf2", "dep:hmac", "dep:zeroize"]
signing = ["hexz-common/signing"]

[dev-dependencies]
tempfile = "3.8"
rand = "0.8"
wiremock = "0.6"
rstest = "0.18"
proptest = "1.0"
