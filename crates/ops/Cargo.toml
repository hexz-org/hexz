[package]
name = "hexz-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "High-level snapshot operations: pack, write, inspect, sign"

[dependencies]
hexz-common.workspace = true
hexz-core = { workspace = true, default-features = false }
hexz-store = { workspace = true }
tracing.workspace = true
serde.workspace = true
bincode.workspace = true
sha2.workspace = true
blake3 = "1.5"
crc32fast = "1.3"
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }

# Write path
crossbeam = "0.8"
num_cpus = "1.16"
indicatif = "0.17"
rayon = "1.8"
walkdir = "2.4"
ignore = "0.4"

[dev-dependencies]
hexz-store = { workspace = true }
tempfile = "3.8"
rand = { workspace = true }
wiremock = "0.6"
rstest = "0.18"
proptest = "1.0"
bincode = { workspace = true }

[features]
default = ["compression-zstd", "encryption", "signing"]
compression-zstd = ["hexz-core/compression-zstd"]
encryption = ["hexz-core/encryption"]
signing = ["hexz-common/signing", "hexz-core/signing"]

[lints]
workspace = true
