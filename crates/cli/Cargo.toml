[package]
name = "hexz-cli"
version.workspace = true
edition.workspace = true
autobenches = false
authors.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "CLI tool for managing Hexz deduplicated archives"

[lints]
workspace = true

[dependencies]
hexz-core = { workspace = true }
hexz-store = { workspace = true }
hexz-ops = { workspace = true }
hexz-common = { workspace = true }
hexz-fuse = { workspace = true, optional = true }
hexz-server = { workspace = true, optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
indicatif = "0.17"
rpassword = "7.0"
walkdir = "2.4"
hex = { workspace = true }
sha2 = { workspace = true }
blake3 = "1.5"
crc32fast = "1.3"
bincode = { workspace = true }
daemonize = { version = "0.5", optional = true }
fuser = { version = "0.14", optional = true }
lz4_flex = "0.11"
tempfile = "3.10"
serde = { workspace = true }
serde_json = "1.0"
tar = "0.4"
libc = "0.2.180"
ctrlc = "3.5.1"
colored = "3.1.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = { workspace = true }
rayon = "1.10"
flate2 = "1.0"
assert_cmd = "2.0"
predicates = "3.0"
bytes = { workspace = true }

[lib]
name = "hexz_cli"
path = "src/lib.rs"
bench = false

[[bin]]
name = "hexz"
path = "src/main.rs"
bench = false

[features]
default = ["fuse", "server", "compression-zstd", "encryption", "diagnostics", "signing", "s3"]

# Cloud storage
s3 = ["hexz-store/s3"]

# Core functionalities
fuse = ["dep:hexz-fuse", "dep:daemonize", "dep:fuser"]
server = ["dep:hexz-server", "dep:daemonize"]
encryption = ["hexz-core/encryption", "hexz-ops/encryption"]
signing = ["hexz-common/signing", "hexz-ops/signing"]

# Compression algorithms
compression-zstd = ["hexz-core/compression-zstd", "hexz-ops/compression-zstd"]

# Optional tools
diagnostics = []
