[package]
name = "strata"
version = "0.0.1"
edition = "2024"
authors = ["Will McCallion"]
license = "Apache-2.0"
repository = "https://github.com/willmccallion/strata"
description = "CLI tool for managing Strata snapshots and datasets"

[dependencies]
strata-core.workspace = true
strata-common = { workspace = true, features = [] }
strata-fuse = { workspace = true, optional = true }
strata-server = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
indicatif = "0.17"
rpassword = "7.0"
hex.workspace = true
sha2.workspace = true
crc32fast = "1.3"
bincode.workspace = true
daemonize = { version = "0.5", optional = true }
fuser = { version = "0.14", optional = true }
lz4_flex = "0.11"
tempfile = "3.10"
serde_json = "1.0"
libc = "0.2.180"
ctrlc = "3.5.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand.workspace = true
flate2 = "1.0"

[lib]
name = "strata_cli"
path = "src/lib.rs"

[[bench]]
name = "read_throughput"
harness = false
path = "benches/macro/read_throughput.rs"

[[bench]]
name = "sparse_access"
harness = false
path = "benches/macro/sparse_access.rs"

[[bench]]
name = "concurrency"
harness = false
path = "benches/macro/concurrency.rs"

[[bench]]
name = "gzip_comparison"
harness = false
path = "benches/macro/gzip_comparison.rs"

[[bench]]
name = "http_throughput"
harness = false
path = "benches/http_throughput.rs"
required-features = ["strata-core/async-http"]

[features]
default = ["fuse", "server", "compression-zstd", "encryption", "diagnostics", "signing"]

# Core functionalities
fuse = ["dep:strata-fuse", "dep:daemonize", "dep:fuser"]
server = ["dep:strata-server", "dep:daemonize"]
encryption = []
signing = ["strata-common/signing"]

# Compression algorithms
compression-zstd = []

# Optional tools
diagnostics = []

# Advanced backends
firecracker = []

async-http = ["strata-core/async-http"]
