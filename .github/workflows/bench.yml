name: Benchmark Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Micro Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config

      - name: Run micro benchmarks (quick profile)
        run: cargo bench --package hexz-cli --bench compression -- --quick --output-format bencher | tee output.txt
        continue-on-error: true

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Hexz Micro Benchmarks
          tool: cargo
          output-file-path: output.txt
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: false
          save-data-file: false
