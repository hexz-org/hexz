name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build Python wheels for all platforms ──────────────────────────────────
  wheels:
    name: Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path crates/loader/Cargo.toml
          before-script-linux: |
            # Fix ring crate aarch64 cross-compilation (GCC doesn't define __ARM_ARCH)
            export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # ── Build source distribution ──────────────────────────────────────────────
  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/loader/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ── Build Rust binaries ────────────────────────────────────────────────────
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: default
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # No fuse (cross-compiling libfuse is complex)
            features: server,compression-zstd,encryption,diagnostics,signing,s3
          - os: macos-latest
            target: x86_64-apple-darwin
            # No fuse on macOS CI (macfuse requires kernel extension)
            features: server,compression-zstd,encryption,diagnostics,signing,s3
          - os: macos-latest
            target: aarch64-apple-darwin
            features: server,compression-zstd,encryption,diagnostics,signing,s3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # No fuse or server (daemonize is Unix-only)
            features: compression-zstd,encryption,diagnostics,signing,s3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux x86_64)
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config
      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
      - name: Build
        shell: bash
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo build --release --target ${{ matrix.target }} --package hexz-cli
          else
            cargo build --release --target ${{ matrix.target }} --package hexz-cli --no-default-features --features ${{ matrix.features }}
          fi
      - name: Archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/hexz.exe dist/hexz-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/hexz dist/hexz-${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/

  # ── Publish to crates.io ──────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: [binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish in real dependency order (non-dev deps determine ordering).
          # hexz-core's dev-deps on hexz-store/hexz-ops/hexz-reconstruct are fine
          # because --no-verify skips building; they just need a version in Cargo.toml
          # so crates.io can record the dep without resolving it at publish time.
          cargo publish -p hexz-common --no-verify
          sleep 30
          cargo publish -p hexz-core --no-verify
          sleep 30
          cargo publish -p hexz-store --no-verify
          cargo publish -p hexz-reconstruct --no-verify
          sleep 30
          cargo publish -p hexz-ops --no-verify
          sleep 30
          cargo publish -p hexz-fuse --no-verify
          cargo publish -p hexz-server --no-verify
          sleep 30
          cargo publish -p hexz-cli --no-verify

  # ── Publish to PyPI ────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release ─────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [binaries, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            wheels/*
