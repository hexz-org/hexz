# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# cargo-deny 0.19+: unmaintained scope is "all"|"workspace"|"transitive"|"none"
# vulnerability/notice/unsound are always enforced; use ignore[] to allow specific advisories
[advisories]
unmaintained = "workspace"
yanked = "warn"

# version = 2: unlicensed/copyleft removed; only allow-list is used
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "openssl"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0b321bbf }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
