[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/fuse",
    "crates/server",
    "crates/cli",
    "crates/loader",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Will McCallion"]
repository = "https://github.com/Alethic-Systems/hexz"
license = "Apache-2.0"

[workspace.dependencies]
hexz-common = { path = "crates/common", default-features = false }
hexz-core = { path = "crates/core" }
hexz-fuse = { path = "crates/fuse" }
hexz-server = { path = "crates/server" }

anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.5"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
