[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/fuse",
    "crates/server",
    "crates/cli",
    "crates/loader",
    "tools/xtask",
]

[workspace.package]
version = "0.4.3"
edition = "2024"
authors = ["Will McCallion"]
repository = "https://github.com/hexz-org/hexz"
license = "Apache-2.0"

[workspace.dependencies]
hexz-common = { path = "crates/common", version = "0.4.3", default-features = false }
hexz-core = { path = "crates/core", version = "0.4.3" }
hexz-fuse = { path = "crates/fuse", version = "0.4.3" }
hexz-server = { path = "crates/server", version = "0.4.3" }

anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.5"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
