site_name: Strata Documentation
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.indexes

# 1. Enable Mermaid support
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # 2. Enable Python auto-docs
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/loader/python]
          options:
            # Hide implementation details
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            # Show type annotations
            show_signature_annotations: true
            separate_signature: true
            # Filter out private/dunder methods by default
            filters:
              - "!^_"  # Hide private methods (single underscore)
            # Member ordering
            members_order: source
            # Docstring style
            docstring_style: google
            docstring_section_style: table

# 3. Full site navigation matching your tree
nav:
  - Home: index.md
  - Tutorials:
    - Getting Started: tutorials/getting-started.md
    - First ML Pipeline: tutorials/first-ml-pipeline.md
