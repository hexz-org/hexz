site_name: Hexz
site_description: High-performance, deduplicated archive format
repo_url: https://github.com/hexz-org/hexz
repo_name: hexz-org/hexz

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
