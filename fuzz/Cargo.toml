[package]
name = "hexz-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
hexz-core = { path = "../crates/core", features = ["encryption", "compression-zstd", "signing"] }
hexz-common = { path = "../crates/common", features = ["signing"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
ed25519-dalek = "2.1"

# Prevent this from interfering with workspace compilation
[workspace]
members = ["."]

[[bin]]
name = "decompress_lz4"
path = "fuzz_targets/decompress_lz4.rs"
doc = false

[[bin]]
name = "decompress_zstd"
path = "fuzz_targets/decompress_zstd.rs"
doc = false

[[bin]]
name = "header_parse"
path = "fuzz_targets/header_parse.rs"
doc = false

[[bin]]
name = "index_parse"
path = "fuzz_targets/index_parse.rs"
doc = false

[[bin]]
name = "cdc_chunking"
path = "fuzz_targets/cdc_chunking.rs"
doc = false

[[bin]]
name = "encryption_roundtrip"
path = "fuzz_targets/encryption_roundtrip.rs"
doc = false

[[bin]]
name = "decrypt_arbitrary"
path = "fuzz_targets/decrypt_arbitrary.rs"
doc = false

[[bin]]
name = "ed25519_verify"
path = "fuzz_targets/ed25519_verify.rs"
doc = false

[[bin]]
name = "header_validation"
path = "fuzz_targets/header_validation.rs"
doc = false

[[bin]]
name = "master_index_load"
path = "fuzz_targets/master_index_load.rs"
doc = false

[[bin]]
name = "zstd_dictionary"
path = "fuzz_targets/zstd_dictionary.rs"
doc = false
